name: test

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:auth
      - run: npm run redteam:smoke
      - name: Branch contains latest main (PRs only)
        if: github.event_name == 'pull_request'
        run: npm run check:branch-fresh -- --base origin/${{ github.base_ref }}
      - name: Reject Cursor commit attribution on branch
        env:
          CURSOR_ATTRIBUTION_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$CURSOR_ATTRIBUTION_BASE" ] || [ "$CURSOR_ATTRIBUTION_BASE" = "0000000000000000000000000000000000000000" ]; then
            npm run check:cursor-attribution -- --base HEAD~1
          else
            npm run check:cursor-attribution -- --base "$CURSOR_ATTRIBUTION_BASE"
          fi

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  design-detect:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: DESIGN_DETECT_WARN_ONLY=1 npm run design:detect
