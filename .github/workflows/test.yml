name: test

on:
  push:
  pull_request:

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Runs before any npm install, so a poisoned lifecycle script never executes.
      - run: node scripts/check-supply-chain.mjs

  unit:
    needs: supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Auth invariant
        run: |
          npm run dev > /tmp/meethint-dev.log 2>&1 &
          DEV_PID=$!
          trap 'kill $DEV_PID 2>/dev/null || true' EXIT
          ready=0
          PORT=$(node --input-type=module -e "import { DEV_PORT } from './scripts/ports.mjs'; process.stdout.write(String(DEV_PORT))")
          for attempt in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:${PORT}/__app-env" >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/meethint-dev.log
            exit 1
          fi
          npm run check:auth
      - run: npm run redteam:smoke
      - name: Branch contains latest main (PRs only)
        if: github.event_name == 'pull_request'
        run: npm run check:branch-fresh -- --base origin/${{ github.base_ref }}
      - name: Reject Cursor commit attribution on branch
        env:
          CURSOR_ATTRIBUTION_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$CURSOR_ATTRIBUTION_BASE" ] || [ "$CURSOR_ATTRIBUTION_BASE" = "0000000000000000000000000000000000000000" ]; then
            npm run check:cursor-attribution -- --base HEAD~1
          else
            npm run check:cursor-attribution -- --base "$CURSOR_ATTRIBUTION_BASE"
          fi
      - name: Lint report
        continue-on-error: true
        run: npm run lint

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # Apt mirrors flake. Install system libraries only when the browser
      # cache missed. A hit skips this step; the browser bytes are already local.
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2; do
            timeout 600 npx playwright install --with-deps chromium && exit 0
            echo "install with system deps failed (attempt $attempt)"
            sleep 15
          done
          npx playwright install chromium
      - name: Confirm cached Playwright browser
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: test -d "$HOME/.cache/ms-playwright"
      - run: npm run test:e2e

  design-detect:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: DESIGN_DETECT_WARN_ONLY=1 npm run design:detect
